<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-transparent.svg" />
    <link rel="icon" type="image/png" href="/favicon-transparent.png" />
    <link rel="apple-touch-icon" href="/favicon-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyftr — Workout &amp; Nutrition Tracker</title>
    <meta
      name="description"
      content="Log workouts, run guided gym sessions, and track nutrition and bodyweight. Self-hosted, so the data stays yours."
    />
    <meta name="theme-color" content="#00b8d9" />

    <!--
      Every self-hosted instance ships this file, so a crawler that finds someone's server
      would be indexing their private training log. noindex is the privacy-correct default;
      the marketing site at lyftr-app.pages.dev is what should rank. Social unfurlers read
      the og:* tags below regardless of this directive, so shared links still preview.

      No canonical here on purpose: an individual's own instance pointing at the project's
      marketing page would be claiming to be a copy of it, which it isn't.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      og:url is deliberately absent — unfurlers fall back to the URL actually being shared,
      which is right whether that is the public demo or someone's own hostname.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lyftr" />
    <meta property="og:title" content="Lyftr — Workout &amp; Nutrition Tracker" />
    <meta
      property="og:description"
      content="Log workouts, run guided gym sessions, and track nutrition and bodyweight. Self-hosted, so the data stays yours."
    />
    <!--
      Absolute, and pointing at the stable /og-image.png rather than the landing page's
      hashed /_astro/banner.<hash>.png, which changes on every site build. A relative path
      would be unreachable to an unfurler when the instance is on a LAN.
      Dimensions are declared so the card can be laid out before the 590 KB is fetched.
    -->
    <meta property="og:image" content="https://lyftr-app.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Lyftr — self-hosted workout tracker on phone and desktop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lyftr — Workout &amp; Nutrition Tracker" />
    <meta
      name="twitter:description"
      content="Log workouts, run guided gym sessions, and track nutrition and bodyweight. Self-hosted, so the data stays yours."
    />
    <meta name="twitter:image" content="https://lyftr-app.pages.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Lyftr — self-hosted workout tracker on phone and desktop" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
