<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-transparent.svg" />
    <link rel="icon" type="image/png" href="/favicon-transparent.png" />
    <link rel="apple-touch-icon" href="/favicon-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyftr — Workout &amp; Nutrition Tracker</title>
    <meta
      name="description"
      content="Log workouts, run guided gym sessions, and track nutrition and bodyweight. Self-hosted, so the data stays yours."
    />
    <!--
      Static on purpose, and it does not follow the theme toggle. Three things were tried
      before settling here:

      Rewriting it from JS on every toggle works — the attribute tweens between surfaces —
      but browsers do not reliably repaint their chrome from it without a reload, so the
      colour was right in the DOM and stale on screen.

      A prefers-color-scheme pair is the usual advice and is wrong for this app: the theme
      comes from localStorage and defaults to dark whatever the OS says, so a light-mode OS
      would paint a light bar over a dark app.

      What actually repaints browser-drawn UI on a toggle is `color-scheme`, which
      packages/shared/src/theme/tokens.ts emits into :root and .dark. That covers
      scrollbars and form controls with no JavaScript. Safari 26 no longer reads
      theme-color at all and takes the page background, which body already sets from the
      same tokens.

      So this is one value matching surfaces.dark.base and the store's dark-first default —
      the same thing GitHub ships alongside its own light/dark toggle.
    -->
    <meta name="theme-color" content="#070d1a" />

    <!--
      Every self-hosted instance ships this file, so a crawler that finds someone's server
      would be indexing their private training log.

      No og:* tags for the same reason: they need an absolute image URL, and the only one
      available at build time is the project's CDN — so sharing a private instance in a chat
      would tell that CDN the instance hostname. Links still preview from the title and
      description above.
    -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
