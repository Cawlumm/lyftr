# The Expo app's web export, beside the Vite frontend instead of replacing it.
#
#   docker compose -f docker-compose.yml -f docker-compose.app-web.yml up -d --wait backend app-web
#
# An override file, not a `profiles:` entry in docker-compose.yml: `docker buildx bake`
# (the CI image step) loads every profile, so a profiled service there would be built by
# the web e2e job as well. Here only the app-web job asks for it.
services:
  app-web:
    image: cwlumm/lyftr-app-web:latest
    # Repo root, like `frontend`: the build installs the npm workspace to reach packages/shared.
    build:
      context: .
      dockerfile: mobile/Dockerfile.web
    restart: unless-stopped
    environment:
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-backend:3000}
    ports:
      # 8081, not ${PORT}: nothing else claims it, so this can run beside `frontend` on 80.
      - "${APP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
