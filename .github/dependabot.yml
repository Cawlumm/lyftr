# Dependency updates.
#
# Shaped for one maintainer, not a team: monthly rather than daily, grouped so a
# framework bump is one pull request instead of nine, and a cooldown so a release that
# gets yanked in its first week never reaches you. Patch updates are ignored outright —
# wger does the same, and they are almost never worth a review on their own. Security
# advisories are unaffected by any of this; Dependabot raises those regardless of
# schedule, grouping, or the patch-ignore rule below.
#
# The `ignore` entries at the bottom of the npm block record decisions already taken in
# the dependency audit (#120), so they are not re-proposed every month. Delete an entry
# to re-open that question deliberately.
version: 2
updates:
  # ── Workspace: web + mobile + shared, one lockfile at the root ──────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # No expo/react groups: every package that would have matched them is ignored
      # below, so the groups would only ever be empty.
      lint:
        patterns:
          - eslint
          - eslint-*
          - "@typescript-eslint/*"
          - typescript
      test:
        patterns:
          - vitest
          - "@vitest/*"
          - jest
          - jest-*
          - "@playwright/*"
          - "@testing-library/*"
      build:
        patterns:
          - vite
          - "@vitejs/*"
          - tailwindcss
          - nativewind
          - autoprefixer
          - postcss
    ignore:
      # Reviewing every patch bump costs more than it returns.
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

      # ── The Expo/React Native ecosystem moves as one, or not at all ─────────────
      #
      # These versions are dictated by the Expo SDK, not chosen per package — that is
      # what `expo install --check` enforces. Bumping one of them on its own produces a
      # combination the SDK never shipped, so the update is wrong however green it looks.
      #
      # The first run proved it: react-native 0.81.5 -> 0.87.0 and @expo/metro-runtime
      # 6.1.2 -> 57.0.9 arrived together against SDK 54 and failed mobile type-check
      # (#127). Note the two traps in that pair — @expo/* is scoped, so an `expo-*`
      # pattern never matches it, and react-native is 0.x, where a minor bump is a
      # breaking change that no major-only rule will stop.
      #
      # So: no version updates at all for this ecosystem. An SDK upgrade is a deliberate
      # piece of work with a migration guide and a device build behind it. Security
      # advisories are unaffected and still raised.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: "@react-native/*"
      - dependency-name: metro
      - dependency-name: metro-*

      # React's version is pinned by whatever React Native and the SDK expect, so it is
      # part of the same set. react 18 -> 19.2.8 landed in the first run (#128) and could
      # not even install: npm ci failed because the lockfile Dependabot generated was out
      # of sync with package.json.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"

      # React Router 7 fixes two advisories that cannot fire here — one needs SSR, which
      # this SPA does not do, and the other needs a user-controlled navigation target,
      # which no route in the app has. See #120. Worth doing on its own merits, not as a
      # security bump.
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]

  # ── Backend ────────────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - backend
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # ── Workflow actions ───────────────────────────────────────────────────────────
  #
  # A pinned action is a supply-chain dependency like any other, and these are the one
  # ecosystem where patch updates matter: actions are usually pinned to a major tag that
  # moves under you, so an explicit bump is the only visible record.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # ── Container base images ──────────────────────────────────────────────────────
  #
  # Nothing watched these before. golang:1.26-alpine and node:20-alpine float to the
  # latest patch on rebuild, but alpine:3.19 and nginx:alpine are the runtime layers that
  # actually ship, and a pinned alpine minor goes stale quietly.
  # Majors are excluded: the first run proposed node 20-alpine -> 26-alpine (#124),
  # six majors of build toolchain in one step, and alpine 3.19 -> 3.24 (#123), which
  # moves the runtime's libc. Both are deliberate work, not a dependency bump.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
