name: CI

# Backend (Go) + mobile (Expo, native and web export) + shared package tests, the integrated
# Playwright e2e, image builds, and the Fly deploy — one workflow, gated by a shared
# `changes` job so it never skips itself the way a top-level `paths:` trigger filter
# would (that's the mobile-ci.yml pattern this replaced — see git history — and it has
# a real GH Actions trap: a workflow that's skipped-at-the-trigger-level rather than
# skipped-at-the-job-level can leave a required check permanently "waiting for status"
# on PRs that don't touch its paths). docs/markdown-only changes still skip the whole
# run via `paths-ignore`, since nothing here depends on them.
#
# Per-job filtering (the `changes` job + dorny/paths-filter): a backend-only change skips
# the mobile jobs, a mobile-only change skips the Go + version-smoke jobs,
# and so on. The image-build and deploy jobs stay eligible regardless — they're guarded
# with `!failure() && !cancelled()` so a *skipped* (not failed) test dependency doesn't
# cascade into skipping the build/deploy gate. On main/tags every test job runs
# unconditionally, so filtering never weakens deploys.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # No paths-ignore on pull_request, deliberately. A workflow skipped at the TRIGGER
  # leaves its checks Pending forever, and main requires these checks — so a
  # markdown-only PR would be permanently unmergeable. The `changes` job below already
  # filters per job, so a docs-only PR still runs nothing but that one cheap job; it just
  # runs it, and reports the checks as skipped, which counts as passed.
  # `push` keeps its paths-ignore: no branch protection depends on those runs.
  pull_request:
    branches: [main]

# Least privilege — nothing in this workflow needs to write via GITHUB_TOKEN (image pushes and
# the Fly deploy use their own secrets). Matches mobile-ci.yml's prior explicit read-only scope,
# now applied workflow-wide since mobile checks run here too.
permissions:
  contents: read

jobs:
  # Which domains changed? Gates the fast unit-test jobs below so a backend-only PR doesn't
  # run the mobile suites (and vice-versa). ci.yml is in both filters so workflow edits run all.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # dorny/paths-filter reads the PR file list via the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # utils/codes_test.go pins the registry to the client catalog.
              - 'packages/shared/src/i18n/locales/en.json'
              - 'fly.toml'
              - 'fly/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/app/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  test:
    name: Go unit tests
    needs: changes
    # Run when backend changed, or always on main/tags (never weaken the deploy gate).
    if: >-
      needs.changes.outputs.backend == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: cd backend && go mod download
      # ./... not a hand-listed subset: this job ran 3 packages of 7, so utils/,
      # stores/, config/ and oedb/ were invisible here. utils/ owns every error
      # sentence the API emits, and this PR adds 223 lines of tests to it that
      # would otherwise never gate a merge. Measured hermetic (httptest only, no
      # outbound hosts) and ~23s total; -timeout is per package, and the slowest
      # is 15s.
      - run: cd backend && go test ./... -timeout 30s

  mobile:
    name: Mobile + shared checks
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level (not workflow-level) so a superseded mobile run gets canceled on rapid pushes —
    # mobile-ci.yml had this at the workflow level; scoping it to just this job here avoids ever
    # risking cancellation of the build-backend/build-frontend/deploy-demo jobs on a main push.
    concurrency:
      group: ci-mobile-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # One workspace install covers mobile + packages/shared.
      - run: npm ci

      # --- packages/shared (jest + tsc) ---
      - run: npm run shared:type-check
      - run: npm run shared:test

      # --- mobile (Expo app) ---
      - run: npm run type-check -w @lyftr/mobile
      - run: npm run lint -w @lyftr/mobile
      - run: npm run test -w @lyftr/mobile -- --ci

  web-export:
    name: Web export
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-web-export-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Export web bundle
        run: npm run export:web -w @lyftr/mobile

      - name: Check the export
        run: |
          test -f apps/app/dist/index.html || { echo "apps/app/dist/index.html missing"; exit 1; }
          grep -q '<script' apps/app/dist/index.html || { echo "index.html has no <script> tag"; exit 1; }
          for pat in 'name="description"' 'name="theme-color"' 'name="color-scheme"' 'rel="manifest"' 'rel="apple-touch-icon"' 'rel="icon"' 'noindex'; do
            grep -q "$pat" apps/app/dist/index.html || { echo "index.html is missing $pat"; exit 1; }
          done
          test -f apps/app/dist/manifest.json || { echo "apps/app/dist/manifest.json missing"; exit 1; }
          # polyfills.web.ts leaves the Hermes-only intl-pluralrules out; browsers ship Intl.PluralRules.
          # Match that package's own error strings, not 'PluralRules', which i18next contains legitimately.
          if grep -rlE --include='*.js' 'Not a valid plural type|select\(\) called on incompatible' apps/app/dist; then
            echo "intl-pluralrules shipped to web"; exit 1
          fi
          # Pins the zustand CJS override in apps/app/metro.config.js: its ESM build uses
          # import.meta, which throws when the bundle runs as a classic script.
          if grep -rl --include='*.js' 'import\.meta' apps/app/dist; then
            echo "import.meta found in the exported bundle"; exit 1
          fi

      - name: Report bundle size
        run: |
          {
            echo "### Web export size"
            echo
            echo "Entry: \`$(grep -o '[^"]*_expo/static/js/web/entry-[^"]*\.js' apps/app/dist/index.html | head -n1)\`"
            echo
            echo "| File | Raw (bytes) | Gzip (bytes) |"
            echo "|---|---:|---:|"
            raw_total=0; gz_total=0
            while IFS= read -r f; do
              raw=$(wc -c < "$f"); gz=$(gzip -c "$f" | wc -c)
              raw_total=$((raw_total + raw)); gz_total=$((gz_total + gz))
              echo "| \`${f#apps/app/dist/}\` | $raw | $gz |"
            done < <(find apps/app/dist -type f \( -name '*.js' -o -name '*.css' \) | sort)
            echo "| **Total** | **$raw_total** | **$gz_total** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: apps/app/dist/
          retention-days: 7

      # Last, so a failing budget still leaves the size table and the artifact above.
      # Budgets live in apps/app/perf-budget.json; the script fails the job when exceeded.
      - name: Enforce bundle budget
        run: node apps/app/scripts/bundle-budget.mjs

  # The e2e gate: the Expo app's web export, served by the `frontend` image
  # (apps/app/Dockerfile.web) and driven by the Playwright harness in apps/app/e2e.
  e2e-app:
    name: Playwright E2E (Expo app)
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.mobile == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    # Not ubuntu-latest: that moved to 26.04, which has no ICU 74, and Playwright's WebKit
    # build links against it, so every `mobile` project test died at browser launch.
    # Unpin once the Playwright we run ships WebKit for 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "JWT_SECRET=ci-test-secret-$(openssl rand -hex 16)" >> .env
          # Published on 8081, the harness's default (apps/app/e2e/config.ts).
          echo "PORT=8081" >> .env
          echo "CORS_ORIGIN=http://localhost,http://localhost:8081" >> .env

      - uses: docker/setup-buildx-action@v3

      # Same cache scopes as build-backend/build-frontend, so whichever runs first warms
      # the others.
      - name: Build images with layer cache
        run: |
          docker buildx bake \
            --set "backend.cache-from=type=gha,scope=lyftr-backend" \
            --set "backend.cache-to=type=gha,scope=lyftr-backend,mode=max" \
            --set "frontend.cache-from=type=gha,scope=lyftr-frontend" \
            --set "frontend.cache-to=type=gha,scope=lyftr-frontend,mode=max" \
            --load

      - name: Start stack
        run: docker compose up -d --wait

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/app && npx playwright install chromium webkit

      - name: Install Playwright system dependencies
        run: cd apps/app && npx playwright install-deps chromium webkit

      - name: Run E2E tests
        run: cd apps/app && npm run test:e2e

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-app
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7

  version-smoke:
    name: Version injection smoke test
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image with a known version
        run: docker build --build-arg VERSION=smoke-9.9.9 -t lyftr-backend:smoke ./backend
      - name: Assert the binary reports the injected version
        run: |
          set -euo pipefail
          out=$(docker run --rm lyftr-backend:smoke --version)
          echo "version output: $out"
          echo "$out" | grep -q 'smoke-9.9.9'

  # Size is reported, never enforced — the convention kubernetes/kubernetes uses, and the
  # default of every size-labeller in the wild (CodelyTV ships fail_if_xl: false;
  # oven-sh/bun has no size labels at all).
  #
  # A label is better feedback than a block or a comment: it shows in the PR list without
  # notifying anyone, it is filterable, and it never has to be argued with. Some large
  # PRs are legitimate — a vendored dependency, a migration, one mechanical rename across
  # forty files — and a gate that has to be overridden teaches people to override gates.
  #
  # Thresholds are Kubernetes': XS 0-9, S 10-29, M 30-99, L 100-499, XL 500-999, XXL
  # 1000+, "ignoring generated files". Lockfiles, build output and snapshots do not count;
  # a lockfile refresh is thousands of lines nobody reads.
  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to apply the size label
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Label by reviewable churn
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --numstat "$BASE...$HEAD" --             . ':(exclude)**/package-lock.json' ':(exclude)**/*.lock'             ':(exclude)**/*.tsbuildinfo' ':(exclude)**/dist/**' ':(exclude)**/*.snap'             | awk '{ a += $1; d += $2 } END { print (a + d) + 0 }')

          if   [ "$CHANGED" -lt 10 ];   then SIZE=XS
          elif [ "$CHANGED" -lt 30 ];   then SIZE=S
          elif [ "$CHANGED" -lt 100 ];  then SIZE=M
          elif [ "$CHANGED" -lt 500 ];  then SIZE=L
          elif [ "$CHANGED" -lt 1000 ]; then SIZE=XL
          else SIZE=XXL
          fi
          echo "reviewable churn: ${CHANGED} lines -> size/${SIZE}"

          # Replace any previous size label so the PR carries exactly one.
          for old in XS S M L XL XXL; do
            [ "$old" = "$SIZE" ] || gh pr edit "$PR" --remove-label "size/$old" 2>/dev/null || true
          done
          gh pr edit "$PR" --add-label "size/$SIZE"

          # Past the point where a review stops being useful, say so once, in the run
          # summary. Advisory: this job never fails.
          if [ "$CHANGED" -gt 5000 ]; then
            echo "::warning::This PR changes ${CHANGED} reviewable lines. Past 5000 the automated review is skipped entirely, and a diff this size is hard for anyone to hold in their head — consider splitting it."
          fi

  build-backend:
    name: Build & push backend image
    needs: [test, e2e-app, version-smoke]
    # Still verify the image builds even if a test dependency was *skipped* by filtering;
    # only a genuine failure/cancel of a dependency should stop it.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe --tags` resolves
      - name: Resolve version
        id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lyftr-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # push=false on PRs/feature branches — builds only (validates Dockerfile)
          # push=true on main merge or version tag — publishes to Docker Hub
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=lyftr-backend
          cache-to: type=gha,scope=lyftr-backend,mode=max

  build-frontend:
    name: Build & push frontend image
    needs: [test, e2e-app, mobile, web-export]
    if: ${{ !failure() && !cancelled() }}   # tolerate skipped (filtered) test deps; stop on real failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lyftr-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # The Expo export.
          file: ./apps/app/Dockerfile.web
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # push=false on PRs/feature branches — builds only (validates Dockerfile)
          # push=true on main merge or version tag — publishes to Docker Hub
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=lyftr-frontend
          cache-to: type=gha,scope=lyftr-frontend,mode=max

  deploy-demo:
    name: Deploy to Fly.io
    needs: [test, e2e-app, version-smoke, mobile, web-export]
    # main pushes run every test job (their `if` includes main), so this only deploys on a
    # clean run; the failure/cancel guard keeps a filtered skip from ever cascading here.
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe --tags` resolves
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --build-arg VERSION="$(git describe --tags --always)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
