name: CI

# Backend (Go) + web (Vite) + mobile (Expo) + shared package tests, the integrated
# Playwright e2e, image builds, and the Fly deploy — one workflow, gated by a shared
# `changes` job so it never skips itself the way a top-level `paths:` trigger filter
# would (that's the mobile-ci.yml pattern this replaced — see git history — and it has
# a real GH Actions trap: a workflow that's skipped-at-the-trigger-level rather than
# skipped-at-the-job-level can leave a required check permanently "waiting for status"
# on PRs that don't touch its paths). docs/markdown-only changes still skip the whole
# run via `paths-ignore`, since nothing here depends on them.
#
# Per-job filtering (the `changes` job + dorny/paths-filter): a backend-only change skips
# the web/mobile unit jobs, a web-only change skips the Go + version-smoke + mobile jobs,
# and so on. The image-build and deploy jobs stay eligible regardless — they're guarded
# with `!failure() && !cancelled()` so a *skipped* (not failed) test dependency doesn't
# cascade into skipping the build/deploy gate. On main/tags every test job runs
# unconditionally, so filtering never weakens deploys.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Least privilege — nothing in this workflow needs to write via GITHUB_TOKEN (image pushes and
# the Fly deploy use their own secrets). Matches mobile-ci.yml's prior explicit read-only scope,
# now applied workflow-wide since mobile checks run here too.
permissions:
  contents: read

jobs:
  # Which domains changed? Gates the fast unit-test jobs below so a backend-only PR doesn't
  # run the web/mobile suites (and vice-versa). ci.yml is in both filters so workflow edits run all.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # dorny/paths-filter reads the PR file list via the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'fly.toml'
              - 'fly/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              # Web imports @lyftr/shared, so a shared-only edit must run web's unit
              # suite, lint and e2e. Without this a change to shared could break the web
              # app with fully green CI — this filter is what replaced the byte-comparison
              # fork guard that used to protect the duplicated dateUtils.
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  test:
    name: Go unit tests
    needs: changes
    # Run when backend changed, or always on main/tags (never weaken the deploy gate).
    if: >-
      needs.changes.outputs.backend == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: cd backend && go mod download
      - run: cd backend && go test ./... -timeout 60s

  unit:
    name: Web unit tests
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # Root workspace install — web resolves @lyftr/shared through it.
      - run: npm ci
      - run: cd web && npm run coverage   # runs the unit suite + prints a coverage report (not gated)
      # After the tests, deliberately: lint is a hard gate, and the warning budget has
      # no slack, so putting it first would let a single new `any` abort the job before
      # any test ran — turning a style nit into "no test signal at all".
      - run: cd web && npm run lint       # gates on errors; the `any`/deps backlog is warnings (see eslint.config.mjs)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 7

  mobile:
    name: Mobile + shared checks
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level (not workflow-level) so a superseded mobile run gets canceled on rapid pushes —
    # mobile-ci.yml had this at the workflow level; scoping it to just this job here avoids ever
    # risking cancellation of the build-backend/build-frontend/deploy-demo jobs on a main push.
    concurrency:
      group: ci-mobile-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # One workspace install covers mobile + packages/shared (and web, unused here).
      - run: npm ci

      # --- packages/shared (jest + tsc) ---
      - run: npm run shared:type-check
      - run: npm run shared:test

      # --- mobile (Expo app) ---
      - run: npm run type-check -w @lyftr/mobile
      - run: npm run lint -w @lyftr/mobile
      - run: npm run test -w @lyftr/mobile -- --ci

  e2e:
    name: Playwright E2E
    needs: changes
    # Integration test spans both images, so run it if either domain changed.
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.web == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "JWT_SECRET=ci-test-secret-$(openssl rand -hex 16)" >> .env
          echo "PORT=80" >> .env

      - uses: docker/setup-buildx-action@v3

      - name: Build images with layer cache
        run: |
          docker buildx bake \
            --set "backend.cache-from=type=gha,scope=lyftr-backend" \
            --set "backend.cache-to=type=gha,scope=lyftr-backend,mode=max" \
            --set "frontend.cache-from=type=gha,scope=lyftr-frontend" \
            --set "frontend.cache-to=type=gha,scope=lyftr-frontend,mode=max" \
            --load

      - name: Start stack
        run: docker compose up -d --wait

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd web && npx playwright install chromium webkit

      - name: Install Playwright system dependencies
        run: cd web && npx playwright install-deps chromium webkit

      # Readiness (API up + exercise seed finished) is the suite's own globalSetup now,
      # which registers a throwaway account rather than logging in as a seeded one. So
      # this job runs against the production default: no DEMO_MODE, no demo account.

      - name: Run E2E tests
        run: cd web && npm run test:e2e:docker

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  version-smoke:
    name: Version injection smoke test
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image with a known version
        run: docker build --build-arg VERSION=smoke-9.9.9 -t lyftr-backend:smoke ./backend
      - name: Assert the binary reports the injected version
        run: |
          set -euo pipefail
          out=$(docker run --rm lyftr-backend:smoke --version)
          echo "version output: $out"
          echo "$out" | grep -q 'smoke-9.9.9'

  build-backend:
    name: Build & push backend image
    needs: [test, unit, e2e, version-smoke]
    # Still verify the image builds even if a test dependency was *skipped* by filtering;
    # only a genuine failure/cancel of a dependency should stop it.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe --tags` resolves
      - name: Resolve version
        id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lyftr-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # push=false on PRs/feature branches — builds only (validates Dockerfile)
          # push=true on main merge or version tag — publishes to Docker Hub
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=lyftr-backend
          cache-to: type=gha,scope=lyftr-backend,mode=max

  build-frontend:
    name: Build & push frontend image
    needs: [test, unit, e2e]
    if: ${{ !failure() && !cancelled() }}   # tolerate skipped (filtered) test deps; stop on real failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lyftr-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # push=false on PRs/feature branches — builds only (validates Dockerfile)
          # push=true on main merge or version tag — publishes to Docker Hub
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=lyftr-frontend
          cache-to: type=gha,scope=lyftr-frontend,mode=max

  deploy-demo:
    name: Deploy to Fly.io
    needs: [test, unit, e2e, version-smoke]
    # main pushes run every test job (their `if` includes main), so this only deploys on a
    # clean run; the failure/cancel guard keeps a filtered skip from ever cascading here.
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe --tags` resolves
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --build-arg VERSION="$(git describe --tags --always)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
