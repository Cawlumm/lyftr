name: Dependency review

# Fails a pull request that *introduces* a dependency with a known advisory, or one under
# a licence the project cannot ship.
#
# This is the counterpart to Dependabot rather than a duplicate of it. Dependabot tells
# you about what is already installed — a backlog, most of which needs a major version
# bump nobody is going to take this week. This only looks at what the diff adds, so it
# stays quiet until a pull request would make things worse. That makes it the one
# security check here that can be a hard failure without becoming noise.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Needed to leave the summary comment on the pull request.
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Moderate and above fails. The existing moderate findings are all either
          # unreachable or blocked behind a major (see #120), but that is an argument for
          # not adding more, not for tolerating new ones.
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Copyleft licences would make the project undistributable as it stands.
          deny-licenses: AGPL-3.0, GPL-3.0
          # zod 3.25.76 arrives with Expo SDK 58's @expo/cli, which pins ^3.25.76 even in its
          # newest release, and the advisory's only fix is zod 4.6.6, so there is nothing to
          # upgrade to. @expo/cli imports zod in two dev-server schema files (DevToolsPlugin,
          # createMCPDevToolsExtensionSchema), from the v3 entry rather than the zod 4 core the
          # advisory describes; it is build tooling, never shipped in the app. Tracked upstream
          # at expo/expo#52470. Remove this when @expo/cli moves off zod 3.
          #
          # glob 10.5.0 (GHSA-3g3m-2fjr-6pw4, an AbortSignal bypass in glob's own timeout handling)
          # is test-exclude's, which jest and vitest coverage use to pick files. It is already in
          # the lockfile on main; it shows as new whenever the install is re-resolved, because npm
          # recomputes its dev flag. The fix is glob 14.0.2 and test-exclude pins ^10, so there is
          # nothing to upgrade to; it is test tooling, never shipped, and nothing there passes an
          # AbortSignal. Remove this when test-exclude moves past glob 10.
          #
          # minimatch 9.0.9 (GHSA-g3hv-75wg-m249, globparts amplification) is glob 10's own
          # dependency in the same subtree, flagged for the same reason; its fix is minimatch
          # 11.0.1, which glob 10 does not take. Test tooling, never shipped. Remove it together
          # with the glob entry above.
          #
          # Allows these advisories only: anything else new at moderate or above still fails.
          allow-ghsas: GHSA-mrhx-c7xc-m3w5, GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249
