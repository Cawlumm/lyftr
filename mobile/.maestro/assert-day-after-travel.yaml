# The point of the whole feature, on a real device: an entry keeps the day it was
# filed under after the phone changes timezone.
#
# The runner flips the emulator's zone between log-weight.yaml and this flow, so the
# app relaunches somewhere else entirely. EXPECTED_DAY is the day the entry was
# written under, passed in by the runner; UNEXPECTED_DAY is the day it would drift to
# if a screen went back to deriving the label from the device.
#
# Asserting both directions matters. EXPECTED_DAY alone passes on a list that renders
# *both* days, which is exactly what a partial fix looks like — the history row
# corrected while the chart or the detail header still reads the instant.
#
# This caught a real regression: with the device moved NY -> Tokyo, a row stored as
# logged_on 2026-08-09 rendered "Aug 10, 2026", because the row formatted logged_at
# (the instant) instead of the stored day.
appId: local.lyftr.app
env:
  EXPECTED_DAY: ""
  UNEXPECTED_DAY: ""
---
- runFlow: login.yaml

- tapOn:
    text: "Weight"
    index: 0
- assertVisible: "Track your body weight over time"

- scrollUntilVisible:
    element: "HISTORY"
    direction: DOWN

- assertVisible: ${EXPECTED_DAY}
- assertNotVisible: ${UNEXPECTED_DAY}
