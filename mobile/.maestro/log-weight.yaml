# Logs a weight and asserts it lands on the device's today.
#
# The weight value is left at its prefilled default — the day is what is under test,
# not the number.
#
# The screen guards against a second entry on a day that already has one ("Already
# logged on ... Log again anyway?"). That guard is a feature, but it means a bare
# tapOn "Log Weight" can succeed as a *tap* while submitting nothing — which is how an
# earlier version of this flow passed 13/13 without writing a row. Waving the guard
# through keeps the flow honest on a day that already has an entry.
appId: local.lyftr.app
---
- runFlow: login.yaml

- tapOn:
    text: "Weight"
    index: 0
- assertVisible: "Track your body weight over time"

# "Log Weight" appears twice on this screen — the card heading and the submit button.
# index 1 is the button; index 0 would tap the heading and silently do nothing.
- tapOn:
    text: "Log Weight"
    index: 1

- runFlow:
    when:
      visible: "Log Anyway"
    commands:
      - tapOn: "Log Anyway"

- evalScript: |
    ${output.day = new Date()
      .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}

# The row the app just wrote must be filed under the device's today.
- scrollUntilVisible:
    element: "HISTORY"
    direction: DOWN
- assertVisible: ${output.day}
