# Response security headers, included by the server block and by every location that sets
# its own add_header: nginx drops all inherited add_header directives the moment a
# location declares one, so a header that is only at server level silently vanishes on
# exactly those paths. Shared by apps/app/nginx.conf.template and fly/nginx.fly.conf.
#
# CSP, directive by directive (checked against the Expo web export, dist/index.html):
#   script-src 'self' 'wasm-unsafe-eval'  The export has no inline script, so no hash or
#                                         'unsafe-inline' is needed. wasm-unsafe-eval is
#                                         for the lazily loaded barcode scanner (WebAssembly
#                                         only, not eval()).
#   style-src ... 'unsafe-inline'         react-native-web injects its stylesheet at runtime
#                                         and sets style="" attributes; there is no nonce
#                                         to give it. Style injection cannot run script.
#   img-src ... https: http:              Exercise and food images live on the oedb catalog
#                                         (operator-configurable, can be self-hosted) and
#                                         Open Food Facts, so the host list is open.
#   connect-src 'self' https: http:       The user types the server URL into the app, and
#                                         self-hosted backends are often plain http on a LAN.
#   worker-src blob:                      the scanner spawns a worker from a Blob URL.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# camera is the barcode scanner; everything else the app never asks for is switched off.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
