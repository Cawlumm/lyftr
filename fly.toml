# fly.toml — Lyftr demo instance
# Set app name below, then: fly secrets set JWT_SECRET=<random-32-chars>
# First deploy: fly deploy
# See fly/SETUP.md for full instructions.

app = "lyftr-demo"
primary_region = "fra"

# Fly's default is 5s between SIGTERM and SIGKILL. The backend needs longer: up to 5s
# draining in-flight requests, then up to 4s to take the single SQLite connection and
# checkpoint the WAL into lyftr.db (see backend/db/sqlite.go Close). Being killed inside
# that window is exactly the bug this leaves writes stranded in lyftr.db-wal.
kill_timeout = "20s"

[build]
  dockerfile = "fly/Dockerfile"

[env]
  ENV        = "production"
  PORT       = "3000"
  DB_PATH    = "/app/data/lyftr.db"
  CORS_ORIGIN = "https://lyftr-demo.fly.dev"

# JWT_SECRET must be set as a secret:
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32)

[http_service]
  internal_port       = 80
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[mounts]]
  source      = "lyftr_data"
  destination = "/app/data"

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
