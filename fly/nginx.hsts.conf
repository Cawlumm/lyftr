# Fly only: its edge terminates TLS for every request, so HSTS is always truthful there.
# The self-hosted nginx (apps/app/nginx.conf.template) can sit on plain http on a LAN,
# where a pinned HSTS would lock the browser out, so it does not send it.
# Included wherever apps/app/nginx.security-headers.conf is (see the note there).
add_header Strict-Transport-Security "max-age=31536000" always;
